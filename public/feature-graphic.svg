<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262F1F"/>
      <stop offset="50%" stop-color="#353F2D"/>
      <stop offset="100%" stop-color="#46523B"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FAF9F6"/>
      <stop offset="40%" stop-color="#C4B688"/>
      <stop offset="80%" stop-color="#A08D52"/>
      <stop offset="100%" stop-color="#C4B688"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#bannerBg)"/>

  <!-- Decorative circles -->
  <circle cx="150" cy="250" r="300" fill="none" stroke="#A08D52" stroke-width="1.5" stroke-opacity="0.2"/>
  <circle cx="900" cy="400" r="220" fill="none" stroke="#A08D52" stroke-width="2" stroke-opacity="0.15"/>

  <!-- Center Content -->
  <g transform="translate(512, 175)">
    <!-- Logo Badge -->
    <rect x="-55" y="-95" width="110" height="110" rx="32" fill="#46523B" stroke="#A08D52" stroke-width="3"/>
    <circle cx="0" cy="-40" r="30" fill="none" stroke="#C4B688" stroke-width="2.5"/>
    <polygon points="0,-58 20,-48 0,-38 -20,-48" fill="#C4B688"/>
    <circle cx="0" cy="-28" r="5" fill="#A08D52"/>
  </g>

  <text x="512" y="265" text-anchor="middle" fill="url(#goldGrad)" font-family="'Tajawal', sans-serif" font-size="44" font-weight="900">منظومة اعتماد وتوثيق الأنشطة</text>
  <text x="512" y="320" text-anchor="middle" fill="#FAF9F6" font-family="'Tajawal', sans-serif" font-size="24" font-weight="600" opacity="0.95">جامعة المجمعة • الكلية التطبيقية</text>

  <!-- Tags badges -->
  <g transform="translate(512, 385)">
    <!-- Badge 1 -->
    <rect x="-260" y="0" width="160" height="38" rx="19" fill="#ffffff" fill-opacity="0.12" stroke="#A08D52" stroke-width="1.5"/>
    <text x="-180" y="24" text-anchor="middle" fill="#C4B688" font-family="'Tajawal', sans-serif" font-size="14" font-weight="700">اعتماد رئيس الكلية</text>

    <!-- Badge 2 -->
    <rect x="-80" y="0" width="160" height="38" rx="19" fill="#ffffff" fill-opacity="0.12" stroke="#A08D52" stroke-width="1.5"/>
    <text x="0" y="24" text-anchor="middle" fill="#FAF9F6" font-family="'Tajawal', sans-serif" font-size="14" font-weight="700">مزامنة منصة ارتقاء</text>

    <!-- Badge 3 -->
    <rect x="100" y="0" width="160" height="38" rx="19" fill="#ffffff" fill-opacity="0.12" stroke="#A08D52" stroke-width="1.5"/>
    <text x="180" y="24" text-anchor="middle" fill="#C4B688" font-family="'Tajawal', sans-serif" font-size="14" font-weight="700">السجل المهاري الوطني</text>
  </g>
</svg>
