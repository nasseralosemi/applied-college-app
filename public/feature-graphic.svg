<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
  <defs>
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081c15"/>
      <stop offset="60%" stop-color="#1b4332"/>
      <stop offset="100%" stop-color="#2d6a4f"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f3d887"/>
      <stop offset="50%" stop-color="#c59b27"/>
      <stop offset="100%" stop-color="#e6c566"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="500" fill="url(#bannerBg)"/>

  <!-- Decorative circles -->
  <circle cx="150" cy="250" r="300" fill="none" stroke="#c59b27" stroke-width="1.5" stroke-opacity="0.15"/>
  <circle cx="900" cy="400" r="220" fill="none" stroke="#c59b27" stroke-width="2" stroke-opacity="0.1"/>

  <!-- Center Content -->
  <g transform="translate(512, 180)">
    <!-- Logo Badge -->
    <rect x="-55" y="-95" width="110" height="110" rx="28" fill="#1b4332" stroke="#c59b27" stroke-width="3"/>
    <circle cx="0" cy="-40" r="30" fill="none" stroke="#f3d887" stroke-width="3"/>
    <polygon points="0,-58 20,-48 0,-38 -20,-48" fill="#f3d887"/>
    <circle cx="0" cy="-28" r="6" fill="#c59b27"/>
  </g>

  <text x="512" y="270" text-anchor="middle" fill="url(#goldText)" font-family="'Tajawal', sans-serif" font-size="44" font-weight="900">نظام اعتماد الأنشطة والدورات</text>
  <text x="512" y="325" text-anchor="middle" fill="#ffffff" font-family="'Tajawal', sans-serif" font-size="24" font-weight="500" opacity="0.9">الكلية التطبيقية | الربط والمزامنة مع منصة ارتقاء الرسمية</text>

  <!-- Tags badges -->
  <g transform="translate(512, 390)">
    <!-- Badge 1 -->
    <rect x="-260" y="0" width="160" height="38" rx="19" fill="#ffffff" fill-opacity="0.1" stroke="#c59b27" stroke-width="1"/>
    <text x="-180" y="24" text-anchor="middle" fill="#f3d887" font-family="'Tajawal', sans-serif" font-size="14" font-weight="700">اعتماد الكلية الفوري</text>

    <!-- Badge 2 -->
    <rect x="-80" y="0" width="160" height="38" rx="19" fill="#ffffff" fill-opacity="0.1" stroke="#c59b27" stroke-width="1"/>
    <text x="0" y="24" text-anchor="middle" fill="#ffffff" font-family="'Tajawal', sans-serif" font-size="14" font-weight="700">مزامنة منصة ارتقاء</text>

    <!-- Badge 3 -->
    <rect x="100" y="0" width="160" height="38" rx="19" fill="#ffffff" fill-opacity="0.1" stroke="#c59b27" stroke-width="1"/>
    <text x="180" y="24" text-anchor="middle" fill="#f3d887" font-family="'Tajawal', sans-serif" font-size="14" font-weight="700">سجل مهاري معتمد</text>
  </g>
</svg>
